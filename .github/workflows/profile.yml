name: profile

on:
  schedule:
    - cron: '0 9 * * *' # 06:00 em Brasília
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**', '.github/workflows/profile.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md assets
          git diff --cached --quiet || (git commit -m 'chore: atualiza painéis do perfil' && git push)
